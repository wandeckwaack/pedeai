<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PedeAí</title>
<meta name="description" content="PedeAí — comanda digital pra bar e restaurante: mesas, cozinha e caixa. Funciona sem internet, dados só no aparelho." />
<meta name="theme-color" content="#050807" />
<meta name="color-scheme" content="dark light" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PedeAí" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-maskable.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@500;600;700&display=swap" />

<style>
  :root {
    --red: #ff1744;
    --red-deep: #d90032;
    --red-soft: #7d0b25;
    --red-ink: #fff7f8;
    --ink: #050807;
    --ink-2: #09120d;
    --ink-3: #102018;
    --ink-4: #173022;
    --line: #255034;
    --bone: #edffe8;
    --bone-dim: #9ac49a;
    --bone-faint: #5d8a65;
    --paper: #f1ffe9;
    --paper-2: #dff8d2;
    --paper-line: #a8d49b;
    --paper-ink: #102115;
    --paper-faint: #4f7c58;
    --yellow: #b7ff00;
    --yellow-ink: #102000;
    --green: #39ff14;
    --green-ink: #031b08;
    --disc-bg: rgba(0,0,0,.55);
    --card-shadow: 0 1px 2px rgba(0,0,0,.3);
    --pop-shadow: 0 18px 44px rgba(0,0,0,.5);
    --tap: 50px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    color-scheme: dark;
  }
  /* ---- light theme (forced) ---- */
  :root[data-theme="light"] {
    --ink: #efffe9;
    --ink-2: #fbfff8;
    --ink-3: #e1f7d9;
    --ink-4: #c9ebc0;
    --line: #a5d39a;
    --bone: #102115;
    --bone-dim: #47734f;
    --bone-faint: #719b76;
    --disc-bg: rgba(30,22,14,.42);
    --card-shadow: 0 1px 2px rgba(120,100,70,.18);
    --pop-shadow: 0 18px 44px rgba(90,70,45,.28);
    color-scheme: light;
  }
  /* ---- light theme (auto / system) ---- */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --ink: #efffe9;
      --ink-2: #fbfff8;
      --ink-3: #e1f7d9;
      --ink-4: #c9ebc0;
      --line: #a5d39a;
      --bone: #102115;
      --bone-dim: #47734f;
      --bone-faint: #719b76;
      --disc-bg: rgba(30,22,14,.42);
      --card-shadow: 0 1px 2px rgba(120,100,70,.18);
      --pop-shadow: 0 18px 44px rgba(90,70,45,.28);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background-color: var(--ink); color: var(--bone);
    background-image: linear-gradient(rgba(57,255,20,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(57,255,20,.025) 1px, transparent 1px), radial-gradient(circle at 50% -10%, rgba(57,255,20,.1), transparent 38%);
    background-size: 28px 28px, 28px 28px, 100% 100%;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
    transition: background .25s ease, color .25s ease;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; }
  h1, h2, h3, h4 { margin: 0; }
  .anton { font-family: "Anton", "Figtree", sans-serif; font-weight: 400; letter-spacing: .01em; text-transform: uppercase; }
  .mono { font-family: "Spline Sans Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .ic { width: 24px; height: 24px; display: inline-block; flex: none; vertical-align: middle; }
  .ic svg { width: 100%; height: 100%; display: block; }

  #app { max-width: 620px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative; }

  .awning { height: 10px; flex: none; background: repeating-linear-gradient(90deg, var(--red) 0 22px, var(--green) 22px 44px); }
  .awning.thin { height: 6px; opacity: .9; }
  .trialbar { background: var(--yellow); color: var(--yellow-ink); font-weight: 800; font-size: 10.5px; text-align: center; padding: 5px 8px; text-transform: uppercase; letter-spacing: .05em; }
  .updbar { background: var(--ink); color: var(--bone); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 7px 12px; }
  .updbar button { background: var(--yellow); color: var(--yellow-ink); border: none; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 5px 12px; border-radius: 8px; }
  .demobar { background: #2563EB; color: #fff; font-weight: 800; font-size: 10.5px; text-align: center; padding: 5px 8px; text-transform: uppercase; letter-spacing: .05em; }
  .notifhost { display: flex; flex-direction: column; gap: 6px; padding: 0 12px; }
  .notifhost:empty { display: none; }
  .notif { margin-top: 8px; background: var(--yellow); color: var(--yellow-ink); border: 2px solid var(--yellow-ink); border-radius: 12px; padding: 10px 12px; font-weight: 800; font-size: 13px; text-align: left; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.28); animation: slideDown .28s cubic-bezier(.2,1.2,.3,1) both; }
  .notif .nx { margin-left: auto; opacity: .7; flex: none; }
  @keyframes slideDown { from { transform: translateY(-8px); opacity: 0 } to { transform: none; opacity: 1 } }
  .topbar .backchip.exit { border-color: var(--red); color: var(--red); width: auto; min-width: 36px; padding: 0 8px; gap: 4px; display: inline-flex; }
  .topbar .backchip .bl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  #coach { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
  .coach-spot { position: fixed; border-radius: 14px; box-shadow: 0 0 0 4px var(--yellow), 0 0 0 9999px rgba(0,0,0,.62); transition: all .2s ease; pointer-events: none; }
  .coach-bub { position: fixed; left: 50%; transform: translateX(-50%); width: min(88vw, 400px); background: var(--bone); color: var(--ink); border: 2px solid #000; border-radius: 16px; padding: 14px 16px; box-shadow: 0 16px 40px rgba(0,0,0,.45); pointer-events: auto; }
  .coach-bub.center { top: 50%; transform: translate(-50%, -50%); }
  .coach-bub p { margin: 6px 0 12px; font-size: 14px; line-height: 1.5; font-weight: 600; }
  .coach-bub .cg-step { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--red); }
  .coach-bub .cg-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .coach-bub .cg-skip { background: none; border: none; color: var(--ink-soft, #6b6b6b); font-weight: 700; font-size: 13px; padding: 6px 4px; }
  .coach-bub .cg-next { background: var(--red); color: #fff; border: none; font-weight: 800; font-size: 14px; padding: 9px 18px; border-radius: 12px; margin-left: auto; }
  .coach-bub .cg-hint { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--red); }
  .receipt-prev { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-family: "Courier New", ui-monospace, monospace; font-size: 12px; line-height: 1.35; white-space: pre; overflow-x: auto; }
  @media print { body > *:not(iframe) { display: none !important; } }
  .syncdot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin-left: 2px; background: var(--bone-faint); }
  .syncdot.s-online { background: var(--green); box-shadow: 0 0 0 3px rgba(57,255,20,.22); }
  .syncdot.s-offline { background: var(--yellow); }
  .syncdot.s-badpin, .syncdot.s-noroom { background: var(--red); }
  .paircode { display: flex; align-items: center; justify-content: space-between; border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; background: var(--ink); }
  .paircode span { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--bone-dim); }
  .paircode b { font-size: 26px; letter-spacing: .18em; }
  .scanwrap { position: fixed; inset: 0; z-index: 90; background: #000; display: flex; align-items: center; justify-content: center; }
  .scanwrap video { width: 100%; height: 100%; object-fit: cover; }
  .scanwrap .scanbox { position: absolute; width: 62vw; max-width: 300px; aspect-ratio: 1; border: 3px solid var(--yellow); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
  .scanwrap .scanx { position: absolute; top: calc(14px + var(--safe-t)); right: 16px; width: 44px; height: 44px; border-radius: 12px; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
  .scanwrap .scanhint { position: absolute; bottom: calc(40px + var(--safe-b)); left: 0; right: 0; text-align: center; color: #fff; font-weight: 700; font-size: 14px; text-shadow: 0 1px 4px #000; }
  body.kiosk .krail { gap: 16px; }
  body.kiosk .kt .kt-h .ttl { font-size: 21px; }
  body.kiosk .kt .ki { padding: 14px 0; }
  body.kiosk .kt .ki .kx { font-size: 17px; }
  body.kiosk .kt .ki .kbtn { padding: 12px 18px; font-size: 14px; }
  body.kiosk main { padding-bottom: 24px; }
  body.kiosk .screen-title { font-size: 30px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    min-height: var(--tap); padding: 0 20px; border-radius: 14px;
    background: var(--ink-3); color: var(--bone);
    font-size: 15px; font-weight: 700; border: 2px solid var(--line);
    transition: transform .12s cubic-bezier(.2,.9,.3,1.2), filter .12s;
  }
  .btn:active { transform: translateY(1px) scale(.985); filter: brightness(.95); }
  .btn.block { display: flex; width: 100%; }
  .btn.lg { min-height: 58px; font-size: 16px; border-radius: 16px; }
  .btn.red { background: var(--red); border-color: var(--red-deep); color: var(--red-ink); }
  .btn.bone { background: var(--bone); border-color: var(--bone); color: var(--ink); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.ghost.plain { border-color: transparent; }
  .btn.danger { color: #ff6b87; border-color: var(--red-soft); background: transparent; }
  .btn.xl { min-height: 62px; font-size: 17px; }
  .btn .ic { width: 21px; height: 21px; }
  .btn:disabled { opacity: .4; }
  .btn.slab { font-family: "Anton", sans-serif; text-transform: uppercase; letter-spacing: .03em; font-weight: 400; font-size: 19px; }

  .muted { color: var(--bone-dim); }
  .empty { text-align: center; color: var(--bone-faint); padding: 40px 24px; }
  .empty .em-mark { width: 92px; height: 92px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--ink-3); border-radius: 50%; }
  .empty .em-mark svg { width: 58px; height: 58px; }
  .empty p { font-size: 15px; }
  .empty .em-big { font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 22px; color: var(--bone-dim); margin-bottom: 4px; }

  /* ---------- onboarding ---------- */
  .ob { flex: 1; min-height: calc(100dvh - var(--safe-t)); display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: none; touch-action: pan-y; }
  .ob-red { background: var(--red); color: var(--red-ink); }
  .ob-pad { min-height: calc(100dvh - var(--safe-t)); padding: calc(26px + var(--safe-t)) 24px calc(26px + var(--safe-b)); flex: 1; display: flex; flex-direction: column; }
  .ob-mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .ob-top { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
  .ob-actions { display: flex; flex-direction: column; gap: 11px; }

  .wordmark { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: .96; letter-spacing: -.005em; white-space: nowrap; }
  .wordmark .l1 { font-size: clamp(46px, 15.5vw, 60px); }
  .wordmark .l2 { font-size: clamp(46px, 15.5vw, 60px); margin-left: .16em; }
  .wordmark .l2 .bang { color: var(--yellow); margin-left: .02em; }
  .splash-mark { animation: stampIn .5s cubic-bezier(.2,1.4,.4,1) both; transform-origin: left center; }
  .ob-tag { font-size: 17px; font-weight: 600; margin-top: 18px; max-width: 24ch; opacity: .92; }
  .credit { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 11px; font-weight: 600; opacity: .8; }

  .slide-ic { width: 92px; height: 92px; margin-bottom: 20px; color: var(--red); }
  .slide h2 { font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 34px; line-height: .95; }
  .slide p { color: var(--bone-dim); font-size: 15px; margin-top: 12px; max-width: 30ch; }

  .wz-step { font-family: "Anton", sans-serif; font-size: 30px; color: var(--red); text-transform: uppercase; }
  .wz h2 { font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 27px; margin: 2px 0 20px; line-height: .95; }
  .field { display: block; margin-bottom: 15px; }
  .field span { display: block; font-size: 12px; font-weight: 700; color: var(--bone-dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 7px; }
  .field input, .field select, .field textarea {
    width: 100%; min-height: var(--tap); padding: 13px 15px; font-size: 16px; font-weight: 600;
    background: var(--ink-2); border: 2px solid var(--line); border-radius: 12px; color: var(--bone);
  }
  .field textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--red); }
  .pinrow input { letter-spacing: .55em; text-align: center; font-family: "Spline Sans Mono", monospace; }
  .choice { display: flex; flex-direction: column; gap: 11px; }
  .choice button {
    text-align: left; border: 2px solid var(--line); background: var(--ink-2);
    border-radius: 14px; padding: 15px 16px; font-size: 15px; font-weight: 700; color: var(--bone);
    transition: transform .1s;
  }
  .choice button:active { transform: scale(.99); }
  .choice button.on { border-color: var(--red); background: var(--ink-3); box-shadow: inset 4px 0 0 var(--red); }
  .choice button small { display: block; font-weight: 500; color: var(--bone-dim); font-size: 13px; margin-top: 4px; }
  .logo-drop { display: flex; align-items: center; gap: 13px; border: 2px dashed var(--line); border-radius: 14px; padding: 13px; margin-bottom: 15px; }
  .logo-drop img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; }
  .logo-drop .ph { width: 46px; height: 46px; border-radius: 10px; background: var(--ink-3); display: grid; place-items: center; color: var(--bone-faint); }
  .logo-drop .ph .ic { width: 24px; height: 24px; }

  /* ---------- app chrome ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; padding-top: var(--safe-t); background: var(--ink); }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .topbar { background: color-mix(in srgb, var(--ink) 76%, transparent); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); }
  }
  .topbar-in { display: flex; align-items: center; gap: 10px; padding: 11px 15px 10px; }
  .topbar .backchip { width: 36px; height: 36px; border: 2px solid var(--line); border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--ink-2); transition: transform .12s; }
  .topbar .backchip:active { transform: scale(.9); }
  .topbar .backchip .ic { width: 20px; height: 20px; }
  .topbar .blogo { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex: none; }
  .topbar .bmark { width: 32px; height: 32px; flex: none; }
  .topbar .bname { font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 18px; letter-spacing: .02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .staffchip { margin-left: auto; flex: none; display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 5px; background: var(--ink-2); transition: transform .12s; }
  .staffchip:active { transform: scale(.96); }
  .staffchip .av { width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: var(--red-ink); display: grid; place-items: center; font-weight: 800; font-size: 11px; }
  .staffchip .nm { font-size: 12px; font-weight: 800; line-height: 1.05; }
  .staffchip .rl { font-size: 9px; font-weight: 700; color: var(--bone-faint); text-transform: uppercase; letter-spacing: .06em; }

  main { flex: 1; padding: 18px 16px 116px; }
  .view-in { animation: viewIn .22s cubic-bezier(.2,.9,.3,1); }
  .screen-title { font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 26px; margin-bottom: 16px; }
  .screen-sub { color: var(--bone-dim); font-size: 13px; margin: -10px 0 14px; }

  /* tables */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .tcard { text-align: left; border-radius: 18px; background: var(--ink-2); border: 2px solid var(--line); padding: 0; overflow: hidden; min-height: 132px; display: flex; flex-direction: column; box-shadow: var(--card-shadow); transition: transform .12s; }
  .tcard:active { transform: scale(.97); }
  .tcard .bar { height: 7px; background: var(--red); }
  .tcard.wait .bar { background: var(--yellow); }
  .tcard .body { padding: 13px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .tcard .tname { font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 21px; line-height: .9; }
  .tcard .tmeta { font-size: 11px; color: var(--bone-faint); font-weight: 600; }
  .tcard .tflags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tcard .fl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 3px 7px; border-radius: 6px; }
  .tcard .fl.wait { background: var(--yellow); color: var(--yellow-ink); }
  .tcard .fl.kit { background: var(--ink-4); color: var(--bone-dim); }
  .tcard .fl.note { background: var(--ink-4); color: var(--bone-dim); }
  .tcard .ttotal { margin-top: auto; font-family: "Spline Sans Mono", monospace; font-weight: 700; font-size: 21px; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + var(--safe-b)); z-index: 15; width: min(calc(100% - 32px), 588px); box-shadow: 0 10px 28px rgba(0,0,0,.45); }

  /* ---------- COMANDA (paper) ---------- */
  .comanda { background: var(--paper); color: var(--paper-ink); border-radius: 5px; position: relative; padding: 6px 16px 16px; box-shadow: 0 12px 34px rgba(0,0,0,.4); }
  .comanda::before, .comanda::after { content: ""; position: absolute; left: 0; right: 0; height: 9px; background-size: 16px 9px; }
  .comanda::before { top: -8px; background-image: linear-gradient(135deg, var(--paper) 50%, transparent 50%), linear-gradient(-135deg, var(--paper) 50%, transparent 50%); background-position: 0 0; }
  .comanda::after { bottom: -8px; background-image: linear-gradient(45deg, var(--paper) 50%, transparent 50%), linear-gradient(-45deg, var(--paper) 50%, transparent 50%); }
  .comanda-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px dashed var(--paper-line); padding: 8px 0 10px; }
  .comanda-head .ttl { font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 20px; }
  .comanda-head .no { font-family: "Spline Sans Mono", monospace; font-weight: 700; font-size: 15px; color: var(--paper-faint); }
  .cmd-note { display: flex; gap: 7px; align-items: flex-start; font-size: 12.5px; font-weight: 600; color: var(--paper-ink); background: rgba(245,197,24,.28); border-left: 3px solid var(--yellow); padding: 7px 9px; margin: 9px 0 2px; border-radius: 3px; }
  .cmd-note .ic { width: 15px; height: 15px; flex: none; margin-top: 1px; color: var(--paper-faint); }
  .cl { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--paper-line); }
  .cl .cl-main { flex: 1; min-width: 0; text-align: left; color: var(--paper-ink); }
  .cl .cl-name { font-weight: 700; font-size: 14.5px; }
  .cl .cl-name .k { color: var(--red-deep); }
  .cl .cl-unit { font-size: 11.5px; color: var(--paper-faint); font-family: "Spline Sans Mono", monospace; }
  .cl .cl-obs { font-size: 11.5px; color: var(--red-deep); font-weight: 700; margin-top: 2px; }
  .cl .cl-tot { font-family: "Spline Sans Mono", monospace; font-weight: 700; white-space: nowrap; }
  .cl.dropIn { animation: dropIn .4s cubic-bezier(.2,1.5,.4,1) both; }
  .comanda-tot { display: flex; align-items: baseline; justify-content: space-between; padding: 13px 0 3px; }
  .comanda-tot .lbl { font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 17px; }
  .comanda-tot .val { font-family: "Anton", sans-serif; font-size: 30px; }

  .stepper { display: flex; align-items: center; border: 2px solid var(--paper-line); border-radius: 10px; overflow: hidden; background: var(--paper-2); }
  .stepper button { width: 38px; height: 38px; display: grid; place-items: center; color: var(--paper-ink); }
  .stepper button:active { background: var(--paper-line); }

      var n = q.getModuleCount(), cell = px / (n + 8), off = cell * 4, d = "";
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c))
        d += "M" + (off + c * cell).toFixed(2) + " " + (off + r * cell).toFixed(2) + "h" + cell.toFixed(2) + "v" + cell.toFixed(2) + "h-" + cell.toFixed(2) + "z";
      return '<svg width="' + px + '" height="' + px + '" viewBox="0 0 ' + px + ' ' + px + '" style="background:#fff;border-radius:10px">' +
        '<path d="' + d + '" fill="#121010"/></svg>';
    } catch (e) {
      return '<div class="paircode"><span>Sala/PIN</span><b class="mono" style="font-size:18px">' + esc(txt) + '</b></div>';
    }

  // ---- leitor de QR (BarcodeDetector nativo) ----
  function syncCanScan() {
    try { return !!(window.BarcodeDetector && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); } catch (e) { return false; }
  }
  function syncScan(onCode) {
    var ov = document.createElement("div"); ov.className = "scanwrap";
    ov.innerHTML = '<video playsinline autoplay muted></video><div class="scanbox"></div><button class="scanx">' + ic("x", 20) + '</button><div class="scanhint">Aponte pro QR do aparelho principal</div>';
    document.body.appendChild(ov);
    var video = ov.querySelector("video"), stop = false, stream = null;
    function done() { stop = true; try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} ov.remove(); }
    ov.querySelector(".scanx").onclick = done;
    var det; try { det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { toast("Sem leitor de QR"); ov.remove(); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function (s) {
      stream = s; video.srcObject = s; video.play();
      function tick() {
        if (stop) return;
        det.detect(video).then(function (codes) {
          if (codes && codes[0]) {
            var m = String(codes[0].rawValue || "").match(/PEDEAI:([A-Z2-9]{4,10}):(\d{4,8})/i);
            if (m) { done(); onCode(m[1].toUpperCase(), m[2]); return; }
          }
          setTimeout(tick, 350);
        }).catch(function () { setTimeout(tick, 500); });
      }
      setTimeout(tick, 500);
    }).catch(function () { toast("Não consegui abrir a câmera"); done(); });
  }

  function closeBill(t) {
    var svcDefault = !!(state.settings && state.settings.serviceDefault);
    var people = t.people || 1, service = svcDefault, method = null, received = "";
    var disc = { on: false, type: "pct", val: 0 };
    var pct = state.settings.servicePct || 10;
    openSheet("Fechar conta · " + t.name, function (body) {
      var kpend = tableKitchenPending(t);
      body.innerHTML = '<div id="rc"></div>' +
        (kpend ? '<div class="miniline">' + ic("pan", 13) + ' ' + kpend + ' item(ns) ainda no preparo</div>' : '') +
        '<div class="fc-block">' +
          '<div class="divide"><span>Taxa de serviço ' + pct + '%</span><button class="switch' + (service ? " on" : "") + '" id="sw"></button></div>' +
          '<div class="divide"><span>Dividir por</span><div class="stepper dark"><button id="pm">' + ic("minus", 18) + '</button><span class="q" id="pq">' + people + '</span><button id="pp">' + ic("plus", 18) + '</button></div></div>' +
          (canDiscount() ? '<button class="fc-line" id="discBtn"><span>Desconto</span><span class="right muted" id="discLbl">nenhum</span></button>' : '') +
        '</div>' +
        (canDiscount() ? '<div class="disc-panel" id="discPanel" hidden><div class="seg" id="dtype"><button data-t="pct" class="on">%</button><button data-t="rs">R$</button></div>' +
          '<div class="drow"><input id="dval" inputmode="decimal" placeholder="0"><button class="btn red slab" id="dapply" style="min-height:46px;padding:0 18px">OK</button></div></div>' : '') +
        '<div style="font-size:12px;font-weight:800;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 8px">Como vai pagar</div>' +
        '<div class="seg" id="payseg">' + PAY_METHODS.map(function (m) { return '<button data-m="' + m[0] + '">' + m[0] + '</button>'; }).join("") + '</div>' +
        '<div id="cashwrap" hidden style="margin-top:12px"><label class="field" style="margin:0"><span>Valor recebido</span><input id="rcv" inputmode="decimal" placeholder="R$"></label><div class="troco" id="troco" hidden></div></div>';
      var rc = body.querySelector("#rc");
      function subtotal() { return tableTotal(t); }
      function discVal(sub) { if (!disc.on || !disc.val) return 0; return disc.type === "pct" ? sub * Math.min(100, disc.val) / 100 : Math.min(disc.val, sub); }
      function calc() {
        var sub = subtotal(), d = discVal(sub), base = sub - d, svc = service ? base * pct / 100 : 0, total = base + svc;
        return { sub: sub, d: d, base: base, svc: svc, total: total };
      }
      function paint() {
        var c = calc(), h = "";
        t.items.forEach(function (it) { h += '<div class="recap-row"><span>' + it.qty + '× ' + esc(it.name) + '</span><span class="mono">' + money(it.price * it.qty) + '</span></div>'; });
        h += '<div class="recap-row"><span>Subtotal</span><span class="mono">' + money(c.sub) + '</span></div>';
        if (c.d) h += '<div class="recap-row disc"><span>Desconto ' + (disc.type === "pct" ? disc.val + "%" : "") + '</span><span class="mono">- ' + money(c.d) + '</span></div>';
        if (c.svc) h += '<div class="recap-row"><span>Serviço ' + pct + '%</span><span class="mono">' + money(c.svc) + '</span></div>';
        h += '<div class="recap-row grand"><span>Total</span><b>' + money(c.total) + '</b></div>';
        if (people > 1) h += '<div class="recap-row"><span>Por pessoa (' + people + ')</span><b class="mono">' + money(c.total / people) + '</b></div>';
        rc.innerHTML = h;
        var dl = body.querySelector("#discLbl");
        if (dl) dl.textContent = disc.on && disc.val ? (disc.type === "pct" ? disc.val + "%" : money(disc.val)) : "nenhum";
        var troco = body.querySelector("#troco");
        if (method === "Dinheiro") {
          var r = parseBR(received), diff = r - c.total;
          if (r > 0) { troco.hidden = false; troco.className = "troco" + (diff < 0 ? " neg" : ""); troco.innerHTML = '<span>' + (diff < 0 ? "Falta" : "Troco") + '</span><b>' + money(Math.abs(diff)) + '</b>'; }
          else troco.hidden = true;
        } else if (troco) troco.hidden = true;
      }
      body.querySelector("#sw").onclick = function () { service = !service; this.classList.toggle("on", service); haptic(5); paint(); };
      body.querySelector("#pm").onclick = function () { people = Math.max(1, people - 1); body.querySelector("#pq").textContent = people; paint(); };
      body.querySelector("#pp").onclick = function () { people = Math.min(40, people + 1); body.querySelector("#pq").textContent = people; paint(); };
      var db = body.querySelector("#discBtn");
      if (db) {
        var panel = body.querySelector("#discPanel");
        db.onclick = function () { panel.hidden = !panel.hidden; if (!panel.hidden) body.querySelector("#dval").focus(); };
        body.querySelectorAll("#dtype button").forEach(function (bt) {
          bt.onclick = function () { disc.type = bt.dataset.t; body.querySelectorAll("#dtype button").forEach(function (x) { x.classList.toggle("on", x === bt); }); };
        });
        body.querySelector("#dapply").onclick = function () {
          var val = parseBR(body.querySelector("#dval").value);
          disc.val = val; disc.on = val > 0; panel.hidden = true; haptic(5); paint();
        };
      }
      body.querySelectorAll("#payseg button").forEach(function (bt) {
        bt.onclick = function () {
          method = method === bt.dataset.m ? null : bt.dataset.m;
          body.querySelectorAll("#payseg button").forEach(function (x) { x.classList.toggle("on", method && x.dataset.m === method); });
          body.querySelector("#cashwrap").hidden = method !== "Dinheiro";
          haptic(5); paint();
        };
      });
      body.querySelector("#rcv").addEventListener("input", function () { received = this.value; paint(); });
      paint();
    }, function (f) {
      var ok = document.createElement("button"); ok.className = "btn red block lg slab"; ok.textContent = "Confirmar pagamento";

        var base = sub - d, svc = service ? base * pct / 100 : 0, total = base + svc;
        var pay = null;

          byId: t.byId, closedById: state.activeStaffId, closedAt: Date.now() };

  function payFx(amount, cb) {

  // ---------- impressão / comprovante ----------
  // Sem plugin nativo: 3 caminhos que funcionam de verdade —
  //   "navegador"  -> window.print() (ótimo na versão site/PWA; no APK abre o
  //                   diálogo de impressão do Android quando a WebView suporta).
  //   "rawbt"      -> texto ESC/POS pro app RawBT (impressora térmica Bluetooth/USB).
  //   "compartilhar"-> manda o comprovante pro share do Android (qualquer app de impressão).
  // O comprovante também aparece na tela sempre que quiser (sheet com pré-visualização).
  function prn() {
    var p = (state.settings && state.settings.printer) || {};
    return { mode: p.mode || "off", width: p.width || 58, showOnClose: !!p.showOnClose,
      autoBill: !!p.autoBill, header: p.header || "" };
  }
  function receiptLines(o, kind) {
    var w = prn().width === 80 ? 42 : 32;
    var rule = new Array(w + 1).join("-");
    function row(l, r) {
      l = String(l); r = String(r == null ? "" : r);
      if (l.length + r.length + 1 > w) l = l.slice(0, w - r.length - 2) + "…";
      var gap = Math.max(1, w - l.length - r.length);
      return l + new Array(gap + 1).join(" ") + r;
    }
    var L = [];
    L.push(center((state.biz.name || "PedeAí").toUpperCase(), w));
    (prn().header || "").split("\n").forEach(function (h) { if (h.trim()) L.push(center(h.trim(), w)); });
    L.push("");
    L.push(row((kind === "comanda" ? "COMANDA" : "CONTA") + " · " + (o.table || ""), dmy(o.closedAt || Date.now())));
    if (o.byId) { var by = staffById(o.byId); if (by) L.push("Atendente: " + by.name); }
    L.push(rule);
    o.items.forEach(function (it) {
      L.push(row(it.qty + "x " + it.name, kind === "comanda" ? "" : money(it.price * it.qty)));
      if (it.note) L.push("   * " + it.note);
    });
    L.push(rule);
    if (kind !== "comanda") {
      if (o.subtotal != null && (o.discount || o.service)) L.push(row("Subtotal", money(o.subtotal)));
      if (o.discount) L.push(row("Desconto" + (o.discountLabel ? " (" + o.discountLabel + ")" : ""), "-" + money(o.discount)));
      if (o.service) L.push(row("Serviço", money(o.service)));
      L.push(row("TOTAL", money(o.total)));
      if (o.people > 1) L.push(row("Por pessoa (" + o.people + ")", money(o.total / o.people)));
      if (o.pay && o.pay.method) L.push(row("Pago em", o.pay.method));
      if (o.pay && o.pay.received) { L.push(row("Recebido", money(o.pay.received))); L.push(row("Troco", money(o.pay.change || 0))); }
    }
    L.push("");
    L.push(center("PedeAí · comanda digital", w));
    L.push(center(dmy(Date.now()), w));
    return L.join("\n");
  }
  function center(s, w) { s = String(s); if (s.length >= w) return s.slice(0, w); var p = Math.floor((w - s.length) / 2); return new Array(p + 1).join(" ") + s; }
  function dmy(ts) { var d = new Date(ts); function z(n) { return ("0" + n).slice(-2); } return z(d.getDate()) + "/" + z(d.getMonth() + 1) + "/" + d.getFullYear() + " " + z(d.getHours()) + ":" + z(d.getMinutes()); }
  function receiptDocHTML(txt) {
    var mm = prn().width === 80 ? 80 : 58;
    return '<!doctype html><html><head><meta charset="utf-8"><title>Comprovante</title><style>' +
      '@page{size:' + mm + 'mm auto;margin:3mm}' +
      'body{margin:0;font-family:"Courier New",ui-monospace,monospace;font-size:12px;line-height:1.35;color:#000;white-space:pre;width:' + mm + 'mm}' +
      '</style></head><body>' + esc(txt) + '</body></html>';
  }
  function printBrowser(txt) {
    var doc = receiptDocHTML(txt);
    var ifr = document.createElement("iframe");
    ifr.setAttribute("aria-hidden", "true");
    ifr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
    document.body.appendChild(ifr);
    try {
      var d = ifr.contentWindow.document; d.open(); d.write(doc); d.close();
      setTimeout(function () {
        try { ifr.contentWindow.focus(); ifr.contentWindow.print(); } catch (e) { win(); }
        setTimeout(function () { ifr.remove(); }, 1500);
      }, 250);
    } catch (e) { ifr.remove(); win(); }
    function win() {
      try { var w = window.open("", "_blank"); if (w) { w.document.write(doc); w.document.close(); w.focus(); w.print(); } else toast("Libere pop-ups pra imprimir"); }
      catch (e2) { showTextSheet("Comprovante", txt); }
    }
  }
  function printRawBT(txt) {
    var payload = txt + "\n\n\n";
    try { window.location.href = "rawbt:" + encodeURIComponent(payload); return; } catch (e) {}
    try { window.location.href = "intent:" + encodeURIComponent(payload) + "#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end"; }
    catch (e2) { showTextSheet("Comprovante (copie pro RawBT)", txt); }
  }
  function doPrint(o, kind) {
    var txt = receiptLines(o, kind), m = prn().mode;
    haptic(8);
    if (m === "rawbt") return printRawBT(txt);
    if (m === "compartilhar") return shareText(txt);
    printBrowser(txt); // "navegador" e fallback
  }
  function orderFromSale(s) { return { table: s.table, items: s.items, subtotal: s.subtotal, discount: s.discount, discountLabel: s.discountLabel, service: s.service, total: s.total, people: s.people, pay: s.pay, byId: s.byId, closedAt: s.closedAt }; }
  function receiptSheet(o, kind, auto) {

    if (auto && prn().mode !== "off" && prn().mode !== "compartilhar") setTimeout(function () { doPrint(o, kind); }, 350);
  }

        '<div class="divide"><span>Vai pra cozinha</span><button class="switch' + (m && m.kitchen ? " on" : "") + '" id="mk"></button></div>';
      b.querySelector("#mk").onclick = function () { this.classList.toggle("on"); };
    }, function (f) {
      var ok = document.createElement("button"); ok.className = "btn red block lg slab"; ok.textContent = "Salvar";
      ok.onclick = function () {
        var nm = (scrim.querySelector("#mn").value || "").trim();
        var pr = parseFloat((scrim.querySelector("#mp").value || "").replace(",", ".").replace(/[^0-9.]/g, ""));
        var ct = (scrim.querySelector("#mc").value || "Geral").trim() || "Geral";
        var kt = scrim.querySelector("#mk").classList.contains("on");
        if (!nm || isNaN(pr)) { toast("Preencha nome e preço"); return; }
        if (state.cats.indexOf(ct) < 0) state.cats.push(ct);
        if (isNew) state.menu.push({ id: uid(), cat: ct, name: nm, price: pr, kitchen: kt, hidden: false });
        else { m.name = nm; m.price = pr; m.cat = ct; m.kitchen = kt; }
        touchCfg(); persist(); closeSheet(); openMenuEditor();
      };
      f.appendChild(ok);
      if (!isNew) {
        var hd = document.createElement("button"); hd.className = "btn ghost block"; hd.style.marginTop = "8px"; hd.textContent = m.hidden ? "Mostrar no cardápio" : "Ocultar (hoje não tem)";
        hd.onclick = function () { m.hidden = !m.hidden; touchCfg(); persist(); closeSheet(); openMenuEditor(); }; f.appendChild(hd);
        var dl = document.createElement("button"); dl.className = "btn danger block"; dl.style.marginTop = "8px"; dl.textContent = "Excluir item";
        dl.onclick = function () { state.menu = state.menu.filter(function (x) { return x.id !== m.id; }); touchCfg(); persist(); closeSheet(); openMenuEditor(); }; f.appendChild(dl);
      }
    });
  }

  function exportBackup() {
    var data = JSON.stringify(state);
    var name = "pedeai-backup-" + todayStr() + ".json";
    haptic(6);
    try {
      var file = new File([data], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(function () {}); return; }
    } catch (e) {}
    showTextSheet("Backup — copie e guarde", data);
  }
  function importBackup() {
    openSheet("Importar backup", function (b) {
      b.innerHTML = '<p class="muted" style="font-size:13px;margin-bottom:8px">Cole um backup do PedeAí. Isso substitui tudo que está neste aparelho.</p>' +
        '<textarea class="search" id="imt" style="height:180px;font-family:monospace;font-size:11px" placeholder="Cole aqui o texto do backup"></textarea>';
      setTimeout(function () { b.querySelector("#imt").focus(); }, 60);
    }, function (f) {
      var ok = document.createElement("button"); ok.className = "btn red block lg slab"; ok.textContent = "Restaurar";
      ok.onclick = function () {
        var raw = (scrim.querySelector("#imt").value || "").trim();
        if (!raw) { toast("Cole o backup"); return; }
        var p; try { p = JSON.parse(raw); } catch (e) { toast("Backup inválido"); return; }
        if (!p || typeof p !== "object" || !("menu" in p) || !("staff" in p)) { toast("Backup inválido"); return; }
        confirmDialog("Substituir todos os dados deste aparelho pelo backup?", "Restaurar", function () {
          state = p; migrate(); persist(); closeSheet();
          flow = state.setup ? "app" : "welcome"; current = "mesas"; openTableId = null; renderAll(); toast("Backup restaurado");
        }, true);
      };
      f.appendChild(ok);
    });
  }

  // ---------- backup na nuvem (leve: 1 blob por código+PIN no servidor de sync) ----------
  function vaultCode() { var s = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", o = ""; for (var i = 0; i < 6; i++) o += s[Math.floor(Math.random() * s.length)]; return o; }
  function cloudPush(silent) {
    if (isDemo()) { if (!silent) toast("Modo demonstração não faz backup"); return; }
    if (!state.cloud || !state.cloud.code) { state.cloud = { code: vaultCode(), pin: ("" + (1000 + Math.floor(Math.random() * 9000))) }; persist(); }
    var blob = JSON.stringify(state);
    if (blob.length > 900000) { if (!silent) toast("Backup grande demais pra nuvem (tire a logo)"); return; }
    fetch(syncBase() + "/vault", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: state.cloud.code, pin: state.cloud.pin, blob: blob }) })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function () {
        state.cloud.at = Date.now(); persist();
        if (!silent) cloudCodeSheet();
        else toast("Backup na nuvem atualizado");
      })
      .catch(function () { if (!silent) toast("Sem conexão pra salvar na nuvem"); });
  }
  function cloudCodeSheet() {
    openSheet("Backup na nuvem", function (b) {
      b.innerHTML = '<p class="muted" style="font-size:13px;margin-bottom:12px">Guardado. Pra restaurar em qualquer aparelho, use o código e o PIN abaixo. <b>Anote</b> — sem eles não dá pra recuperar.</p>' +
        '<div class="paircode"><span>Código</span><b class="mono">' + esc(state.cloud.code) + '</b></div>' +
        '<div class="paircode"><span>PIN</span><b class="mono">' + esc(state.cloud.pin) + '</b></div>' +
        '<p class="muted" style="font-size:12px;margin-top:12px">Atualize o backup de vez em quando (Ajustes › Dados e backup). É atualizado sozinho quando você fecha o dia.</p>';
    }, function (f) {
      var c = document.createElement("button"); c.className = "btn red block lg slab"; c.textContent = "Copiar código e PIN";
      c.onclick = function () { var s = "PedeAí backup — Código: " + state.cloud.code + "  PIN: " + state.cloud.pin; try { navigator.clipboard.writeText(s); toast("Copiado"); } catch (e) { showTextSheet("Backup na nuvem", s); } };
      f.appendChild(c);
    });
  }
  function cloudPull() {
    openSheet("Restaurar da nuvem", function (b) {
      b.innerHTML = '<p class="muted" style="font-size:13px;margin-bottom:8px">Digite o código e o PIN do backup. Isso substitui tudo neste aparelho.</p>' +
        '<label class="field"><span>Código</span><input id="vc" autocapitalize="characters" maxlength="6" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.28em;font-family:monospace"></label>' +
        '<label class="field pinrow"><span>PIN</span><input id="vp" inputmode="numeric" maxlength="8" placeholder="0000"></label>';
      setTimeout(function () { b.querySelector("#vc").focus(); }, 60);
    }, function (f) {
      var ok = document.createElement("button"); ok.className = "btn red block lg slab"; ok.textContent = "Restaurar";
      ok.onclick = function () {
        var code = (scrim.querySelector("#vc").value || "").trim().toUpperCase().replace(/[^A-Z2-9]/g, "");
        var pin = (scrim.querySelector("#vp").value || "").replace(/\D/g, "");
        if (code.length < 4 || pin.length < 4) { toast("Código e PIN"); return; }
        ok.disabled = true; ok.textContent = "Buscando…";
        fetch(syncBase() + "/vault", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code, pin: pin, get: 1 }) })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function (res) {
            var p; try { p = JSON.parse(res.blob); } catch (e) { throw e; }
            if (!p || !("menu" in p) || !("staff" in p)) throw new Error("bad");
            closeSheet();
            confirmDialog("Substituir todos os dados deste aparelho pelo backup da nuvem?", "Restaurar", function () {
              state = p; state.cloud = { code: code, pin: pin, at: Date.now() }; migrate(); persist();
              flow = state.setup ? "app" : "welcome"; current = "mesas"; openTableId = null; renderAll(); toast("Restaurado da nuvem");
            }, true);
          })
          .catch(function (err) { ok.disabled = false; ok.textContent = "Restaurar"; toast(err === 403 ? "PIN errado" : err === 404 ? "Código não encontrado" : "Não consegui buscar"); });
      };
      f.appendChild(ok);
    });
  }

  function switchUserSheet() {
    openSheet("Quem tá atendendo?", function (body) {
      state.staff.forEach(function (st) {
        var b = document.createElement("button"); b.className = "listrow";
        b.innerHTML = '<span class="cfg-av" style="width:34px;height:34px">' + esc(initials(st.name)) + '</span><span>' + esc(st.name) + '<br><span class="sub">' + (ROLE_LABEL[st.role] || "") + '</span></span>' + (st.id === state.activeStaffId ? '<span class="right" style="color:var(--red)">' + ic("check", 20) + '</span>' : '');
        b.onclick = function () { pickUser(st); }; body.appendChild(b);
      });
    });
  }
  function pickUser(st) {
    if (st.id === state.activeStaffId) { closeSheet(); return; }
    if (st.pin) {
      pinPad(st.name.split(" ")[0], function (val, reset) {
        if (val === st.pin) { state.activeStaffId = st.id; persist(); closeSheet(); current = null; haptic(10); renderApp(); }
        else { toast("PIN errado"); haptic([15, 50, 15]); reset(); }
      });
    } else { state.activeStaffId = st.id; persist(); closeSheet(); current = null; haptic(8); renderApp(); }
  }
  function pinPad(name, onOk) {
    var buf = "";
    openSheet("PIN de " + name, function (b) {
      b.innerHTML = '<div class="pindots" id="pd"></div><div class="keypad" id="kp"></div>';
      var pd = b.querySelector("#pd"), kp = b.querySelector("#kp");
      function draw() { pd.innerHTML = [0, 1, 2, 3].map(function (i) { return '<i class="' + (i < buf.length ? "on" : "") + '"></i>'; }).join(""); }
      ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"].forEach(function (k) {
        var btn = document.createElement("button");
        if (k === "") { btn.className = "kp-empty"; btn.disabled = true; }
        else if (k === "del") { btn.innerHTML = ic("back", 22); btn.onclick = function () { buf = buf.slice(0, -1); haptic(4); draw(); }; }
        else { btn.textContent = k; btn.onclick = function () { if (buf.length < 4) { buf += k; haptic(4); draw(); if (buf.length === 4) setTimeout(function () { onOk(buf, function () { buf = ""; draw(); }); }, 130); } }; }
        kp.appendChild(btn);
      });
      draw();
    });
  }

  // ---------- sheet / toast / count-up ----------
  var scrim = null, sheetEl = null;
  function openSheet(title, buildBody, foot, opts) {
    opts = opts || {};
    var firstOpen = !scrim;
    if (scrim) { scrim.remove(); scrim = null; }
    scrim = document.createElement("div"); scrim.className = "scrim";
    var sh = document.createElement("div"); sh.className = "sheet"; sheetEl = sh;
    sh.innerHTML = '<div class="grab"></div><div class="sheet-head">' +
      (opts.back ? '<button class="hb" data-role="back">' + ic("back", 18) + '</button>' : '') +
      '<h3></h3><button class="hb" data-role="close">' + ic("x", 18) + '</button></div><div class="sheet-body"></div>';
    sh.querySelector("h3").textContent = title;
    sh.querySelector('[data-role="close"]').onclick = function () { closeSheet(); };
    var bk = sh.querySelector('[data-role="back"]'); if (bk) bk.onclick = function () { opts.back(); };
    var body = sh.querySelector(".sheet-body");
    if (foot) { var ff = document.createElement("div"); ff.className = "sheet-foot"; foot(ff); sh.appendChild(ff); }
    scrim.appendChild(sh);
    scrim.addEventListener("click", function (e) { if (e.target === scrim) closeSheet(); });
    document.body.appendChild(scrim);
    enableDrag(sh, body);
    buildBody(body);
    if (firstOpen) { armBack(); haptic(5); }
  }
  function enableDrag(sh, body) {
    var y0 = 0, dy = 0, drag = false;
    function down(e) {
      if (body.scrollTop > 0) return;
      var tgt = e.target;
      if (tgt.closest("input,textarea,select,button,.seg,.keypad,.stepper")) { if (!tgt.closest(".grab,.sheet-head")) return; }
      drag = true; y0 = (e.touches ? e.touches[0].clientY : e.clientY); dy = 0; sh.style.transition = "none";
    }
    function move(e) {
      if (!drag) return;
      var y = (e.touches ? e.touches[0].clientY : e.clientY);
      dy = Math.max(0, y - y0);
      sh.style.transform = "translateY(" + dy + "px)";
    }
    function up() {
      if (!drag) return; drag = false; sh.style.transition = "";
      if (dy > 110) { sh.style.transform = "translateY(100%)"; setTimeout(closeSheet, 120); }
      else sh.style.transform = "";
    }
    sh.addEventListener("touchstart", down, { passive: true });
    sh.addEventListener("touchmove", move, { passive: true });
    sh.addEventListener("touchend", up);
    var head = sh.querySelector(".sheet-head"), grab = sh.querySelector(".grab");
    [head, grab].forEach(function (el) {
      el.addEventListener("mousedown", down);
    });
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }
  function closeSheet(silent) {
    if (scrim) { scrim.remove(); scrim = null; sheetEl = null; if (!silent) haptic(4); }
  }
  function confirmDialog(msg, okLabel, onOk, danger) {
    openSheet("Confirmar", function (b) { b.innerHTML = '<p style="font-size:15px;font-weight:600;line-height:1.5">' + esc(msg) + '</p>'; }, function (f) {
      var ok = document.createElement("button"); ok.className = "btn block lg slab " + (danger ? "danger" : "red"); ok.textContent = okLabel;
      ok.onclick = function () { closeSheet(true); onOk(); };
      var no = document.createElement("button"); no.className = "btn ghost block"; no.style.marginTop = "8px"; no.textContent = "Cancelar"; no.onclick = function () { closeSheet(); };
      f.appendChild(ok); f.appendChild(no);
    });
  }
  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.style.transform = "translateX(-50%)"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1750);
  }
  function countUp(el, from, to) {
    if (!el) return;
    var t0 = performance.now(), dur = 420;
    function step(now) {
      var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = money(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- atualização do app ----------
  // Bate um "estou vivo" anônimo no servidor (no máx. 1x a cada 12h) e recebe de
  // volta { latest, url, notice }. Se houver versão mais nova, o uso fica bloqueado
  // até a instalação. O id é aleatório e não identifica ninguém — só serve pra
  // o Wandeck ver, no painel dele, quantos aparelhos estão usando o app.
  var IIDKEY = "pedeai.iid", BEATKEY = "pedeai.beat";
  var UPD_THROTTLE = 3 * 3600 * 1000;      // checa no máx a cada 3h (+ ao abrir, ao voltar, ao pegar internet)
  var updState = null;                     // { latest, url, notice } — só é setado quando HÁ versão nova
  var updAutoOpened = false, updSnoozeUntil = 0;
  function updInstallId() {
    var v = null;
    try { v = localStorage.getItem(IIDKEY); } catch (e) {}
    if (!v) { v = (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)); try { localStorage.setItem(IIDKEY, v); } catch (e) {} }
    return v;
  }
  function syncBase() { return syncUrl().replace(/\/sync\/?$/i, ""); }
  function verCmp(a, b) {
    var pa = String(a || "0").split("."), pb = String(b || "0").split(".");
    for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
      var d = (parseInt(pa[i], 10) || 0) - (parseInt(pb[i], 10) || 0);
      if (d) return d < 0 ? -1 : 1;
    }
    return 0;
  }
  function updApply(res) {
    if (!res) return;
    if (res.latest && verCmp(res.latest, VERSION) > 0) {
      var isNew = !updState || updState.latest !== res.latest;
      updState = { latest: res.latest, url: res.url || "https://pedeai.deckcorp.com.br/pedeai-latest.apk", notice: res.notice || "" };
      if (isNew) updSnoozeUntil = 0;
      renderAll();                                 // mostra o bloqueio de atualização
    }
  }
  function updBeat(force) {
    var last = 0;
    try { last = parseInt(localStorage.getItem(BEATKEY), 10) || 0; } catch (e) {}
    if (!force && Date.now() - last < UPD_THROTTLE) return;
    try { localStorage.setItem(BEATKEY, String(Date.now())); } catch (e) {}
    var body = { id: updInstallId(), v: VERSION, role: (syncPaired() ? state.sync.role : "solo") };
    try {
      fetch(syncBase() + "/beat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(updApply).catch(function () {});
    } catch (e) {}
  }
  function updOpen() {
    var u = (updState && updState.url) || "https://pedeai.deckcorp.com.br/pedeai-latest.apk";
    try { if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Browser) { Capacitor.Plugins.Browser.open({ url: u }); return; } } catch (e) {}
    try { window.open(u, "_blank"); } catch (e) { try { location.href = u; } catch (e2) {} }
  }
  function updGateActive() {
    return !!updState && flow !== "wizard" && flow !== "tutorial";
  }
  function renderUpdateGate() {
    appEl.innerHTML =
      '<div class="ob ob-red"><div class="awning"></div><div class="ob-pad">' +
        '<div class="ob-top"></div>' +
        '<div class="ob-mid">' + mark(50) +
          '<h2 class="anton" style="font-size:30px;margin-top:16px;line-height:1.05">Atualização disponível</h2>' +
          '<p class="ob-tag">Saiu a versão <b>' + esc(updState.latest) + '</b>' +
            (updState.notice ? ' — ' + esc(updState.notice) : '') +
            '.<br>Baixe pra continuar usando com tudo funcionando.</p>' +
        '</div>' +
        '<div class="ob-actions">' +
          '<button class="btn bone block xl slab" id="updgo">Baixar a v' + esc(updState.latest) + '</button>' +
          '<div class="credit" style="margin-top:12px;color:#fff">A atualização é obrigatória. Depois de instalar, abra o app novamente.</div>' +
        '</div>' +
      '</div></div>';
    document.getElementById("updgo").onclick = function () { haptic(10); updOpen(); };
    if (!updAutoOpened) { updAutoOpened = true; setTimeout(updOpen, 600); }
  }
  function updBanner() {
    if (!updState) return "";   // fora do bloqueio (janela de "agora não") ainda cutuca
    return '<div class="updbar" id="updbar">Atualização disponível · v' + esc(updState.latest) +
      (updState.notice ? ' — ' + esc(updState.notice) : '') +
      '<button id="updgo">Atualizar</button></div>';
  }
  function updWire() {
    var g = document.getElementById("updgo");
    if (g) g.onclick = function () { haptic(10); updOpen(); };
  }
  window.addEventListener("online", function () { updBeat(true); });
  setInterval(function () { updBeat(false); }, UPD_THROTTLE);

  // ---------- service worker ----------
  // Só no modo PWA (site). Dentro do APK (Capacitor) os arquivos já vêm no pacote —
  // um SW aqui só arriscaria servir versão velha depois de atualizar o app.
  if (!window.Capacitor && "serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js?v=google").catch(function () {}); });
  } else if (window.Capacitor && "serviceWorker" in navigator) {
    // limpa qualquer SW/cache de versões antigas do APK
    try {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    } catch (e) {}
  }

  authInit().then(function (ok) {
    if (!ok) { renderAll(); return; }
    authRestore().then(function () { licInit().then(function () { renderAll(); syncStart(); wakeLockMaybe(); updBeat(); }, function () { renderAll(); syncStart(); updBeat(); }); });
  });
})();
</script>
